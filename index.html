<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Room</title>
    <!-- Библиотека HLS.js для m3u8 видеопотоков -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Библиотека PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background-color: #0b0b0b; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .stream-container {
            position: relative; width: 100%; height: 100%;
            max-width: 480px; max-height: 100vh;
            background: #000; overflow: hidden;
            display: flex; flex-direction: column;
        }
        @media (min-width: 481px) {
            .stream-container {
                height: 95vh; max-height: 900px;
                border-radius: 24px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            }
        }
        .video-player {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 67%; 
            object-fit: contain; background: #000;
        }
        .chat-overlay {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 33%; 
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 75%, transparent 100%);
            display: flex; flex-direction: column; justify-content: flex-end;
            z-index: 10;
        }
        .chat-box { width: 100%; height: 100%; overflow: hidden; background: transparent; }
        .chat-box iframe { width: 100%; height: 100%; border: none; background: transparent; }

        /* Кнопка админа внизу */
        #admin-btn {
            position: absolute; bottom: 8px; right: 8px;
            z-index: 100; background: rgba(0, 0, 0, 0.3); color: rgba(255, 255, 255, 0.5);
            border: none; border-radius: 4px;
            width: 24px; height: 24px; font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #admin-btn:hover { background: rgba(0, 0, 0, 0.7); color: #fff; }

        /* Кнопка разблокировки звука для зрителей */
        #sync-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 67%;
            background: rgba(0,0,0,0.4); z-index: 40; display: none;
            justify-content: center; align-items: center; cursor: pointer;
        }
        #sync-btn {
            background: #00ffcc; color: #000; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,255,204,0.4);
        }

        /* Панель администратора */
        #admin-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 67%;
            background: rgba(10, 10, 10, 0.95); z-index: 50;
            display: none; flex-direction: column; padding: 20px; justify-content: center; gap: 12px;
        }
        #admin-panel h3 { color: #00ffcc; font-size: 18px; text-align: center; margin-bottom: 5px; }
        .admin-label { font-size: 12px; color: #aaa; }
        .admin-select, .admin-btn-action {
            width: 100%; padding: 12px; background: #1a1a1a; color: #fff;
            border: 1px solid #333; border-radius: 8px; font-size: 14px; outline: none;
        }
        .admin-btn-action { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="stream-container">
        <!-- Кнопка разблокировки для зрителей -->
        <div id="sync-overlay" onclick="unlockPlayback()">
            <div id="sync-btn">▶ Нажмите для синхронизации</div>
        </div>

        <!-- Кнопка админа внизу -->
        <button id="admin-btn" onclick="handleAdminButtonClick()">⚙️</button>

        <!-- Пульт управления -->
        <div id="admin-panel">
            <h3>Пульт трансляции</h3>
            <div class="admin-label">Выбрать сериал / фильм:</div>
            <select id="movieSelect" class="admin-select" onchange="changeMovieAdmin()">
                <option value="https://o12.anwap.be/ohls/LpCRXyzOPrQYvMy9aA105w/1790123606/CHelovek-pauk_Novyj_denq-48515_(anwap.org).m3u8">Человек-паук: Новый день</option>
                <option value="https://o8.anwap.be/serials/oshls/IUjtqdHF7qTfnQsJGYp_sA/1790282612/Lyudi_Iks_97_1_sezon_-_1_seriya_(anwap.org).m3u8">Люди Икс '97 (1 сезон 1 серия)</option>
            </select>
            <button class="admin-btn-action" onclick="closeAdminPanel()">Скрыть пульт</button>
        </div>

        <!-- Видео плеер -->
        <video id="videoElement" class="video-player" playsinline></video>

        <!-- Чат снизу -->
        <div class="chat-overlay">
            <div class="chat-box">
                <iframe src="https://www5.cbox.ws/box/?boxid=967024&boxtag=lVnQsO" allowtransparency="yes" allow="autoplay" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        let isAdmin = localStorage.getItem('is_stream_admin') === 'true';
        let peer;
        let viewers = [];
        let adminConnection = null;
        let isSyncing = false;

        const ROOM_ID = "strmweb_live_room_stable_2026_v9";

        function updateVideoControls() {
            if (isAdmin) {
                video.controls = true; // Админ может управлять плеером со своего экрана
            } else {
                video.controls = false; // Зрители не имеют доступа к элементам управления и перемотке
            }
        }

        function initP2P() {
            updateVideoControls();
            if (isAdmin) {
                startAsHost();
            } else {
                startAsViewer();
            }
        }

        function startAsHost() {
            if (peer) peer.destroy();
            
            peer = new Peer(ROOM_ID + "_host");

            peer.on('open', () => {
                isAdmin = true;
                localStorage.setItem('is_stream_admin', 'true');
                updateVideoControls();
                console.log("Режим: Хост (Админ)");
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    console.log("ID хоста занят, пробуем переподключиться...");
                    setTimeout(startAsHost, 1500);
                }
            });

            peer.on('connection', (incomingConn) => {
                viewers.push(incomingConn);

                incomingConn.on('open', () => {
                    sendCurrentState(incomingConn);
                });

                incomingConn.on('data', (data) => {
                    if (data.type === 'get_status') {
                        sendCurrentState(incomingConn);
                    }
                });

                incomingConn.on('close', () => {
                    viewers = viewers.filter(c => c !== incomingConn);
                });
            });
        }

        function startAsViewer() {
            if (peer) peer.destroy();

            peer = new Peer();

            peer.on('open', () => {
                connectToHost();
            });

            peer.on('error', () => {
                retryConnection();
            });
        }

        function connectToHost() {
            const conn = peer.connect(ROOM_ID + "_host", { serialization: 'json' });

            conn.on('open', () => {
                adminConnection = conn;
                conn.send({ type: 'get_status' });
            });

            conn.on('data', (data) => {
                handleRemoteCommand(data);
            });

            conn.on('error', () => {
                retryConnection();
            });

            conn.on('close', () => {
                retryConnection();
            });
        }

        function retryConnection() {
            setTimeout(() => {
                if (!isAdmin) {
                    startAsViewer();
                }
            }, 3000);
        }

        initP2P();

        // Обработка нажатия на шестеренку (кнопку админа)
        function handleAdminButtonClick() {
            if (isAdmin) {
                document.getElementById('admin-panel').style.display = 'flex';
                return;
            }

            let pass = prompt("Введите код администратора:");
            if (pass === "777") {
                isAdmin = true;
                localStorage.setItem('is_stream_admin', 'true');
                startAsHost();
                document.getElementById('admin-panel').style.display = 'flex';
            } else if (pass !== null) {
                alert("Неверный пароль!");
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function loadVideo(url, callback) {
            if (url.endsWith('.m3u8')) {
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    if (callback) callback();
                } else if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        if (callback) callback();
                    });
                }
            } else {
                video.src = url;
                if (callback) callback();
            }
        }

        function changeMovieAdmin() {
            const url = document.getElementById('movieSelect').value;
            loadVideo(url, () => {
                video.play();
                broadcastCommand({ type: 'change_movie', url: url, time: 0, paused: false });
            });
        }

        function broadcastCommand(data) {
            if (isAdmin) {
                viewers.forEach(conn => {
                    if (conn && conn.open) {
                        conn.send(data);
                    }
                });
            }
        }

        function unlockPlayback() {
            document.getElementById('sync-overlay').style.display = 'none';
            video.play().catch(() => {});
        }

        function sendCurrentState(targetConn) {
            targetConn.send({
                type: 'sync_state',
                url: document.getElementById('movieSelect').value,
                time: video.currentTime,
                paused: video.paused
            });
        }

        function handleRemoteCommand(data) {
            if (!isAdmin) {
                isSyncing = true;

                if (data.type === 'sync_state' || data.type === 'change_movie') {
                    const currentUrl = document.getElementById('movieSelect').value;
                    if (currentUrl !== data.url) {
                        document.getElementById('movieSelect').value = data.url;
                        loadVideo(data.url, () => {
                            video.currentTime = data.time;
                            if (!data.paused) {
                                video.play().catch(() => {
                                    document.getElementById('sync-overlay').style.display = 'flex';
                                });
                            }
                        });
                    } else {
                        if (Math.abs(video.currentTime - data.time) > 1.5) {
                            video.currentTime = data.time;
                        }
                        if (data.paused) {
                            video.pause();
                        } else {
                            video.play().catch(() => {
                                document.getElementById('sync-overlay').style.display = 'flex';
                            });
                        }
                    }
                } else if (data.type === 'seek') {
                    video.currentTime = data.time;
                } else if (data.type === 'play') {
                    video.play().catch(() => {
                        document.getElementById('sync-overlay').style.display = 'flex';
                    });
                } else if (data.type === 'pause') {
                    video.pause();
                }

                setTimeout(() => { isSyncing = false; }, 400);
            }
        }

        // Перехват действий админа для трансляции зрителям
        video.addEventListener('seeking', () => {
            if (isAdmin && !isSyncing) broadcastCommand({ type: 'seek', time: video.currentTime });
        });
        video.addEventListener('play', () => {
            if (isAdmin && !isSyncing) broadcastCommand({ type: 'play', time: video.currentTime, paused: false });
        });
        video.addEventListener('pause', () => {
            if (isAdmin && !isSyncing) broadcastCommand({ type: 'pause', time: video.currentTime, paused: true });
        });

        // Первичная загрузка видео
        loadVideo(document.getElementById('movieSelect').value);
    </script>
</body>
</html>
