<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Room</title>
    <!-- Библиотека HLS.js для m3u8 видеопотоков -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Библиотека PeerJS для связи между устройствами -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background-color: #0b0b0b; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .stream-container {
            position: relative; width: 100%; height: 100%;
            max-width: 480px; max-height: 100vh;
            background: #000; overflow: hidden;
            display: flex; flex-direction: column;
        }
        @media (min-width: 481px) {
            .stream-container {
                height: 95vh; max-height: 900px;
                border-radius: 24px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            }
        }
        .video-player {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 67%; 
            object-fit: contain; background: #000;
        }
        .chat-overlay {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 33%; 
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 75%, transparent 100%);
            display: flex; flex-direction: column; justify-content: flex-end;
            z-index: 10;
        }
        .chat-box { width: 100%; height: 100%; overflow: hidden; background: transparent; }
        .chat-box iframe { width: 100%; height: 100%; border: none; background: transparent; }

        /* Минималистичная кнопка админа в самом низу поверх чата */
        #admin-btn {
            position: absolute; bottom: 8px; right: 8px;
            z-index: 100; background: rgba(0, 0, 0, 0.3); color: rgba(255, 255, 255, 0.5);
            border: none; border-radius: 4px;
            width: 24px; height: 24px; font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s;
        }
        #admin-btn:hover { background: rgba(0, 0, 0, 0.7); color: #fff; }

        /* Панель администратора (пульт) */
        #admin-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 67%;
            background: rgba(10, 10, 10, 0.95); z-index: 50;
            display: none; flex-direction: column; padding: 20px; justify-content: center; gap: 12px;
        }
        #admin-panel h3 { color: #00ffcc; font-size: 18px; text-align: center; margin-bottom: 5px; }
        .admin-label { font-size: 12px; color: #aaa; }
        .admin-select, .admin-btn-action {
            width: 100%; padding: 12px; background: #1a1a1a; color: #fff;
            border: 1px solid #333; border-radius: 8px; font-size: 14px; outline: none;
        }
        .admin-btn-action { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="stream-container">
        <!-- Минималистичная кнопка админа внизу -->
        <button id="admin-btn" onclick="toggleAdminPanel()">⚙️</button>

        <!-- Пульт управления (виден только админу после ввода пароля) -->
        <div id="admin-panel">
            <h3>Пульт трансляции</h3>
            
            <div class="admin-label">Выбрать сериал / фильм:</div>
            <select id="movieSelect" class="admin-select" onchange="changeMovieAdmin()">
                <option value="https://o12.anwap.be/ohls/LpCRXyzOPrQYvMy9aA105w/1790123606/CHelovek-pauk_Novyj_denq-48515_(anwap.org).m3u8">Человек-паук: Новый день</option>
                <option value="https://o8.anwap.be/serials/oshls/IUjtqdHF7qTfnQsJGYp_sA/1790282612/Lyudi_Iks_97_1_sezon_-_1_seriya_(anwap.org).m3u8">Люди Икс '97 (1 сезон 1 серия)</option>
            </select>

            <button class="admin-btn-action" onclick="closeAdminPanel()">Скрыть пульт</button>
        </div>

        <!-- Видео плеер -->
        <video id="videoElement" class="video-player" playsinline controls></video>

        <!-- Чат снизу -->
        <div class="chat-overlay">
            <div class="chat-box">
                <iframe src="https://www5.cbox.ws/box/?boxid=967024&boxtag=lVnQsO" allowtransparency="yes" allow="autoplay" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        let isAdmin = false;
        let peer;
        let viewers = []; 
        let adminConnection = null;

        const ROOM_ID = "strmweb_live_room_sync_2026"; 

        function initP2P() {
            peer = new Peer();

            peer.on('open', (id) => {
                connectToRoom();
            });
        }

        function connectToRoom() {
            const conn = peer.connect(ROOM_ID + "_host");

            conn.on('open', () => {
                isAdmin = false;
                adminConnection = conn;
                conn.send({ type: 'get_status' });
            });

            conn.on('data', (data) => {
                handleRemoteCommand(data);
            });

            conn.on('error', () => {
                becomeHost();
            });

            setTimeout(() => {
                if (!isAdmin && !adminConnection) {
                    becomeHost();
                }
            }, 1500);
        }

        function becomeHost() {
            if (peer) peer.destroy();
            
            peer = new Peer(ROOM_ID + "_host");

            peer.on('open', () => {
                isAdmin = true;
            });

            peer.on('connection', (incomingConn) => {
                viewers.push(incomingConn);
                
                incomingConn.on('data', (data) => {
                    if (data.type === 'get_status') {
                        incomingConn.send({
                            type: 'sync_state',
                            url: document.getElementById('movieSelect').value,
                            time: video.currentTime,
                            paused: video.paused
                        });
                    }
                });

                incomingConn.on('close', () => {
                    viewers = viewers.filter(c => c !== incomingConn);
                });
            });
        }

        initP2P();

        function toggleAdminPanel() {
            let pass = prompt("Введите код администратора:");
            if (pass === "777") {
                document.getElementById('admin-panel').style.display = 'flex';
            } else if (pass !== null) {
                alert("Неверный пароль!");
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function loadVideo(url) {
            if (url.endsWith('.m3u8')) {
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                } else if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                }
            } else {
                video.src = url;
            }
        }

        function changeMovieAdmin() {
            const url = document.getElementById('movieSelect').value;
            loadVideo(url);
            video.play();
            broadcastCommand({ type: 'change_movie', url: url, time: 0 });
        }

        function broadcastCommand(data) {
            if (isAdmin) {
                viewers.forEach(conn => {
                    if (conn && conn.open) {
                        conn.send(data);
                    }
                });
            }
        }

        function handleRemoteCommand(data) {
            if (!isAdmin) {
                if (data.type === 'sync_state') {
                    document.getElementById('movieSelect').value = data.url;
                    loadVideo(data.url);
                    video.currentTime = data.time;
                    if (!data.paused) {
                        video.play().catch(() => {});
                    }
                } else if (data.type === 'change_movie') {
                    document.getElementById('movieSelect').value = data.url;
                    loadVideo(url = data.url);
                    video.currentTime = data.time;
                    video.play().catch(() => {});
                } else if (data.type === 'seek') {
                    video.currentTime = data.time;
                } else if (data.type === 'play') {
                    video.play().catch(() => {});
                } else if (data.type === 'pause') {
                    video.pause();
                }
            }
        }

        // Перехват действий админа
        video.addEventListener('seeking', () => {
            if (isAdmin) broadcastCommand({ type: 'seek', time: video.currentTime });
        });
        video.addEventListener('play', () => {
            if (isAdmin) broadcastCommand({ type: 'play', time: video.currentTime });
        });
        video.addEventListener('pause', () => {
            if (isAdmin) broadcastCommand({ type: 'pause', time: video.currentTime });
        });

        loadVideo(document.getElementById('movieSelect').value);
    </script>
</body>
</html>
