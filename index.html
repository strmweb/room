<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Room</title>
    <!-- Библиотека HLS.js для m3u8 видеопотоков -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Библиотека PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background-color: #0b0b0b; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .stream-container {
            position: relative; width: 100%; height: 100%;
            max-width: 480px; max-height: 100vh;
            background: #000; overflow: hidden;
            display: flex; flex-direction: column;
        }
        @media (min-width: 481px) {
            .stream-container {
                height: 95vh; max-height: 900px;
                border-radius: 24px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            }
        }
        .video-wrapper-flex {
            position: relative;
            width: 100%;
            height: 67%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }
        .video-player {
            width: 100%; height: 100%;
            object-fit: contain; background: #000;
        }
        .chat-overlay {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 33%; 
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 75%, transparent 100%);
            display: flex; flex-direction: column; justify-content: flex-end;
            z-index: 10;
        }
        .chat-box { width: 100%; height: calc(100% - 26px); overflow: hidden; background: transparent; }
        .chat-box iframe { width: 100%; height: 100%; border: none; background: transparent; }

        .controls-group {
            position: absolute; bottom: 2px; right: 74px;
            z-index: 100; display: flex; gap: 4px; height: 24px; align-items: center;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px;
            width: 22px; height: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .ctrl-btn svg { width: 11px; height: 11px; fill: currentColor; }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }

        .ctrl-btn.admin-active {
            color: #00ffcc;
            border-color: rgba(0, 255, 204, 0.4);
            background: rgba(0, 255, 204, 0.15);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }

        #sync-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 67%;
            background: #000000; z-index: 40; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #waiting-text {
            font-size: 26px; font-weight: 800; letter-spacing: 1px; color: #00ffcc;
            text-transform: uppercase; text-shadow: 0 0 20px rgba(0,255,204,0.4);
            text-align: center; padding: 0 20px;
        }
        #sync-btn {
            display: none; background: #00ffcc; color: #000; padding: 12px 24px;
            border-radius: 20px; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,255,204,0.4); text-align: center; cursor: pointer;
            margin-top: 15px; animation: pulse 1.5s infinite;
        }
        #sync-btn:hover { background: #00e6b8; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #admin-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 67%;
            background: rgba(10, 10, 10, 0.98); z-index: 50;
            display: none; flex-direction: column; padding: 12px 16px; justify-content: space-between;
            overflow-y: auto;
        }
        .admin-header-group {
            display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0;
        }
        #admin-panel h3 { color: #00ffcc; font-size: 15px; text-align: center; margin-bottom: 0; }
        .admin-label { font-size: 11px; color: #aaa; }
        
        .playlist-wrapper {
            position: relative; width: 100%; display: flex; align-items: center; gap: 6px; flex: 1; min-height: 120px;
        }
        .playlist-container {
            flex: 1; height: 100%; background: #141414;
            border: 1px solid #333; border-radius: 8px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 4px; padding: 6px;
            scroll-behavior: smooth;
        }
        .playlist-scroll-btn {
            background: rgba(0, 255, 204, 0.15); color: #00ffcc;
            border: 1px solid rgba(0, 255, 204, 0.4); border-radius: 6px;
            width: 32px; height: 100%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; transition: background 0.2s; flex-shrink: 0;
        }
        .playlist-scroll-btn:hover { background: rgba(0, 255, 204, 0.3); }

        .playlist-item {
            padding: 10px 12px; background: #1f1f1f; color: #ffffff; font-size: 13px;
            border-radius: 6px; cursor: pointer; transition: background 0.2s;
            text-align: left; line-height: 1.3; white-space: normal; word-break: break-word;
        }
        .playlist-item:hover { background: #2c2c2c; }
        .playlist-item.active { background: rgba(0, 255, 204, 0.25); color: #00ffcc; border: 1px solid rgba(0, 255, 204, 0.4); font-weight: 600; }

        .admin-footer-group {
            display: flex; flex-direction: column; gap: 6px; margin-top: 6px; flex-shrink: 0;
        }
        .admin-input, .admin-btn-action {
            width: 100%; padding: 9px 10px; background: #1a1a1a; color: #fff;
            border: 1px solid #333; border-radius: 8px; font-size: 13px; outline: none;
        }
        .admin-file-label {
            display: block; background: #1a1a1a; border: 1px dashed #00ffcc; color: #00ffcc;
            padding: 7px; text-align: center; border-radius: 8px; font-size: 12px; cursor: pointer;
        }
        .admin-file-label:hover { background: rgba(0,255,204,0.1); }
        #localVideoInput { display: none; }
        .admin-btn-action { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="stream-container" id="streamContainer">
        <div id="sync-overlay">
            <div id="waiting-text">Stream Room</div>
            <div id="sync-btn" onclick="applySyncAndPlay()">Включить стрим</div>
        </div>

        <div class="video-wrapper-flex" id="videoHolder">
            <video id="videoElement" class="video-player" playsinline autoplay></video>
        </div>

        <div class="chat-overlay">
            <div class="chat-box">
                <iframe src="https://www5.cbox.ws/box/?boxid=967024&boxtag=lVnQsO" allowtransparency="yes" allow="autoplay" frameborder="0"></iframe>
            </div>
            
            <div class="controls-group">
                <button class="ctrl-btn" onclick="toggleFullscreen()" title="На весь экран">
                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="togglePiP()" title="Картинка в картинке">
                    <svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.99h18v14.02z"/></svg>
                </button>
                <button class="ctrl-btn" id="adminBtn" onclick="toggleAdminPanel()" title="Админ">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c-.12.22.37.29.59.22l2.39-.96c-.5.38-1.03.7-1.62.94l.36 2.54c-.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c-.59-.24-1.13-.56-1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
                <a class="ctrl-btn" href="https://strmweb.github.io/films/" target="_blank" title="Фильмы">
                    <svg viewBox="0 0 24 24"><path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
                </a>
            </div>
        </div>

        <div id="admin-panel">
            <div class="admin-header-group">
                <h3>Пульт трансляции</h3>
                <div class="admin-label">Плейлист</div>
                <div class="playlist-wrapper">
                    <button class="playlist-scroll-btn" onclick="scrollPlaylist(-60)" title="Прокрутить вверх">▲</button>
                    <div id="playlistContainer" class="playlist-container"></div>
                    <button class="playlist-scroll-btn" onclick="scrollPlaylist(60)" title="Прокрутить вниз">▼</button>
                </div>
            </div>

            <div class="admin-footer-group">
                <div class="admin-label">Или вставить ссылку (.m3u8 / mp4):</div>
                <input type="text" id="customUrlInput" class="admin-input" placeholder="https://...">
                <button class="admin-btn-action" onclick="playCustomUrl()">Воспроизвести ссылку</button>

                <div class="admin-label">Или выбрать файл с устройства:</div>
                <label class="admin-file-label">
                    📁 Загрузить видеофайл (.mp4)
                    <input type="file" id="localVideoInput" accept="video/mp4,video/*" onchange="playLocalVideo(event)">
                </label>

                <button class="admin-btn-action" onclick="closeAdminPanel()" style="background: #333; color: #fff;">Скрыть пульт</button>
            </div>
        </div>
    </div>

    <script>
        let video = document.getElementById('videoElement');
        const adminBtn = document.getElementById('adminBtn');
        let isAdmin = false;
        let peer;
        let viewers = [];
        let adminConnection = null;
        let isSyncing = false;
        let wakeLock = null;
        let syncInterval = null;
        let reconnectTimer = null;
        let hasStartedStream = false;
        let latestAdminData = null;   
        let currentHls = null;
        let pauseDebounceTimer = null;

        const ROOM_ID = "strmweb_live_room_stable_2026_v23";

        const peerConfig = {
            host: '0.peerjs.com',
            port: 443,
            path: '/',
            secure: true,
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            },
            debug: 0
        };

        const rawPlaylistData = `
Люди Икс 97 (1 сезон 1 серия)
https://o8.anwap.be/serials/oshls/IUjtqdHF7qTfnQsJGYp_sA/1790282612/Lyudi_Iks_97_1_sezon_-_1_seriya_(anwap.org).m3u8
Люди Икс 97 (1 сезон 2 серия)
https://o8.anwap.be/serials/oshls/HNDDNVU5cxTE6glAC3mVmA/1790296490/Lyudi_Iks_97_1_sezon_-_2_seriya_(anwap.org).m3u8
Люди Икс 97 (1 сезон 3 серия)
https://o8.anwap.be/serials/oshls/fxQ1Vyd_eSz6JgJLV3Fg7A/1791168446/Lyudi_Iks_97_1_sezon_-_3_seriya_(anwap.org).m3u8
Люди Икс 97 (1 сезон 4 серия)
https://o8.anwap.be/serials/oshls/rPxMUpcEI6I7KIdwnLWbkQ/1790301060/Lyudi_Iks_97_1_sezon_-_4_seriya_(anwap.org).m3u8
Люди Икс 97 (1 сезон 5 серия)
https://o8.anwap.be/serials/oshls/WtJF55Cpr376S6NYdQ3Y7A/1790301120/Lyudi_Iks_97_1_sezon_-_5_seriya_(anwap.org).m3u8
Люди Икс 97 (1 сезон 6 серия)
https://o8.anwap.be/serials/oshls/r-wkm0TdDdy5MtdEYdYmIw/1790301196/Lyudi_Iks_97_1_sezon_-_6_seriya_(anwap.org).m3u8
Люди Икс 97 (1 сезон 7 серия)
https://o8.anwap.be/serials/oshls/OD8a3jgGnH8dX3bXg4kXpg/1790301247/Lyudi_Iks_97_1_sezon_-_7_seriya_(anwap.org).m3u8
Люди Икс 97 (1 сезон 8 серия)
https://o8.anwap.be/serials/oshls/IRj6rVZMFQlgGuOs-cGTWg/1790301283/Lyudi_Iks_97_1_sezon_-_8_seriya_(anwap.org).m3u8
Люди Икс 97 (1 сезон 9 серия)
https://o9.anwap.be/serials/oshls/Mk3yOj0cscTRY0uIkvId3Q/1790301313/Lyudi_Iks_97_1_sezon_-_9_seriya_(anwap.org).m3u8
Люди Икс 97 (1 сезон 10 серия)
https://o9.anwap.be/serials/oshls/zLgXHhmoa3mVcAFc2e2KUQ/1790301346/Lyudi_Iks_97_1_sezon_-_10_seriya_(anwap.org).m3u8
        `;

        let playlist = [];
        (() => {
            const lines = rawPlaylistData.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            for (let i = 0; i < lines.length; i += 2) {
                if (lines[i+1]) {
                    playlist.push({ title: lines[i], url: lines[i+1] });
                }
            }
        })();

        let currentPlaylistIndex = 0;
        let activeStreamUrl = playlist[0].url;

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';
            playlist.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'playlist-item' + (index === currentPlaylistIndex ? ' active' : '');
                div.textContent = `${index + 1}. ${item.title}`;
                div.onclick = () => selectPlaylistItem(index);
                container.appendChild(div);
            });
        }
        renderPlaylist();

        function scrollPlaylist(offset) {
            const container = document.getElementById('playlistContainer');
            if (container) { container.scrollTop += offset; }
        }

        function selectPlaylistItem(index) {
            currentPlaylistIndex = index;
            activeStreamUrl = playlist[index].url;
            renderPlaylist();

            broadcastCommand({ type: 'change_movie_index', index: currentPlaylistIndex, url: activeStreamUrl });
            loadVideo(activeStreamUrl, 16, () => { video.play().catch(() => {}); });
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
                if (!isAdmin && (!adminConnection || !adminConnection.open)) {
                    connectToHost();
                }
            }
        });

        function updatePlayerControls() {
            if (video) video.controls = isAdmin;
        }

        function initP2P() {
            updatePlayerControls();
            startAsViewer();
        }

        function startAsHost() {
            if (peer) { try { peer.destroy(); } catch (e) {} }
            peer = new Peer(ROOM_ID + "_host", peerConfig);

            peer.on('open', () => {
                isAdmin = true;
                updatePlayerControls();
                requestWakeLock();
                startHostHeartbeat();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    setTimeout(startAsHost, 1500);
                }
            });

            peer.on('connection', (incomingConn) => {
                viewers.push(incomingConn);

                incomingConn.on('open', () => {
                    sendCurrentState(incomingConn);
                });

                incomingConn.on('data', (data) => {
                    if (data.type === 'get_status') {
                        sendCurrentState(incomingConn);
                    }
                });

                incomingConn.on('close', () => {
                    viewers = viewers.filter(c => c !== incomingConn);
                });
            });
        }

        function startHostHeartbeat() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if (isAdmin && !video.paused && activeStreamUrl) {
                    broadcastCommand({
                        type: 'sync_state',
                        index: currentPlaylistIndex,
                        url: activeStreamUrl,
                        time: video.currentTime,
                        paused: video.paused
                    });
                }
            }, 1500);
        }

        function sendCurrentState(targetConn) {
            if (isAdmin) {
                targetConn.send({
                    type: 'sync_state',
                    index: currentPlaylistIndex,
                    url: activeStreamUrl,
                    time: video.currentTime,
                    paused: video.paused
                });
            }
        }

        function startAsViewer() {
            if (peer) { try { peer.destroy(); } catch (e) {} }
            peer = new Peer(peerConfig);

            let connectionResolved = false;

            peer.on('open', () => {
                connectionResolved = true;
                connectToHost();
            });

            peer.on('error', () => { handleViewerDisconnect(); });

            setTimeout(() => {
                if (!connectionResolved && !hasStartedStream) {
                    showSyncPrompt("Включить стрим");
                }
            }, 2500);
        }

        function connectToHost() {
            if (isAdmin) return;
            if (adminConnection && adminConnection.open) return;

            const conn = peer.connect(ROOM_ID + "_host", { serialization: 'json' });

            conn.on('open', () => {
                adminConnection = conn;
                conn.send({ type: 'get_status' });
                
                if (reconnectTimer) {
                    clearInterval(reconnectTimer);
                    reconnectTimer = null;
                }
            });

            conn.on('data', (data) => {
                latestAdminData = data;

                if (data.type === 'change_movie_index') {
                    currentPlaylistIndex = data.index;
                    activeStreamUrl = data.url;
                    renderPlaylist();

                    if (hasStartedStream) {
                        loadVideo(activeStreamUrl, 16, () => {
                            video.play().catch(() => {});
                        });
                    }
                    return;
                }

                if (data.type === 'sync_state' || data.type === 'seek' || data.type === 'pause' || data.type === 'play') {
                    if (data.index !== undefined && data.index !== currentPlaylistIndex) {
                        currentPlaylistIndex = data.index;
                        activeStreamUrl = data.url;
                        renderPlaylist();
                        if (hasStartedStream) {
                            loadVideo(activeStreamUrl, data.time, () => {
                                if (data.paused) video.pause();
                                else video.play().catch(() => {});
                            });
                        }
                        return;
                    }

                    if (hasStartedStream) {
                        isSyncing = true;
                        if (Math.abs(video.currentTime - data.time) > 2.5) {
                            video.currentTime = data.time;
                        }
                        if (data.paused) {
                            video.pause();
                        } else {
                            video.play().catch(() => {});
                        }
                        setTimeout(() => { isSyncing = false; }, 300);
                        return;
                    }
                }
            });

            conn.on('error', () => { handleViewerDisconnect(); });
            conn.on('close', () => { handleViewerDisconnect(); });
        }

        function showSyncPrompt(buttonText) {
            const syncOverlay = document.getElementById('sync-overlay');
            const waitingText = document.getElementById('waiting-text');
            const syncBtn = document.getElementById('sync-btn');

            syncOverlay.style.display = 'flex';
            if (!hasStartedStream) {
                waitingText.style.display = 'block';
                waitingText.innerText = "Stream Room";
                syncBtn.innerText = buttonText || "Включить стрим";
            } else {
                waitingText.style.display = 'none';
                syncBtn.innerText = "Обновить стрим";
                syncBtn.style.display = 'block';
                syncBtn.onclick = () => location.reload();
            }
            syncBtn.style.display = 'block';
        }

        function handleViewerDisconnect() {
            adminConnection = null;
            if (!isAdmin && hasStartedStream) {
                const syncOverlay = document.getElementById('sync-overlay');
                const waitingText = document.getElementById('waiting-text');
                const syncBtn = document.getElementById('sync-btn');

                syncOverlay.style.display = 'flex';
                waitingText.style.display = 'none';
                syncBtn.innerText = "Обновить стрим";
                syncBtn.style.display = 'block';
                syncBtn.onclick = () => location.reload();
            }

            if (!isAdmin && !reconnectTimer) {
                reconnectTimer = setInterval(() => { connectToHost(); }, 4000);
            }
        }

        initP2P();

        function applySyncAndPlay() {
            hasStartedStream = true;
            document.getElementById('sync-overlay').style.display = 'none';
            video.muted = false;
            requestWakeLock();

            let startTime = 16;
            if (latestAdminData) {
                if (latestAdminData.index !== undefined) {
                    currentPlaylistIndex = latestAdminData.index;
                    activeStreamUrl = playlist[currentPlaylistIndex] ? playlist[currentPlaylistIndex].url : latestAdminData.url;
                    renderPlaylist();
                }
                if (latestAdminData.time !== undefined && latestAdminData.time > 0) {
                    startTime = latestAdminData.time;
                }
            }

            loadVideo(activeStreamUrl, startTime, () => {
                if (latestAdminData && latestAdminData.paused) {
                    video.pause();
                } else {
                    video.play().catch(() => {});
                }
            });
        }

        function toggleAdminPanel() {
            if (isAdmin) {
                const panel = document.getElementById('admin-panel');
                panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
                return;
            }

            let pass = prompt("Введите код администратора:");
            if (pass === "777") {
                isAdmin = true;
                hasStartedStream = true;
                updatePlayerControls();
                adminBtn.classList.add('admin-active');

                document.getElementById('sync-overlay').style.display = 'none';

                startAsHost();
                document.getElementById('admin-panel').style.display = 'flex';
            } else if (pass !== null) {
                alert("Неверный пароль!");
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function playCustomUrl() {
            const urlInput = document.getElementById('customUrlInput');
            let url = urlInput.value.trim();
            if (!url) {
                alert("Введите ссылку на видео!");
                return;
            }
            url = url.replace(/^["'](.+)["']$/, '$1').trim();
            
            activeStreamUrl = url;
            
            broadcastCommand({ type: 'change_movie_index', index: -1, url: activeStreamUrl });
            loadVideo(activeStreamUrl, 16, () => { video.play().catch(() => {}); });
        }

        function playLocalVideo(event) {
            const file = event.target.files[0];
            if (!file) return;
            const fileURL = URL.createObjectURL(file);
            playlist.unshift({ title: `📁 ${file.name}`, url: fileURL });
            currentPlaylistIndex = 0;
            activeStreamUrl = fileURL;
            renderPlaylist();
            
            broadcastCommand({ type: 'change_movie_index', index: 0, url: activeStreamUrl });
            loadVideo(activeStreamUrl, 16, () => { video.play().catch(() => {}); });
        }

        async function togglePiP() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (document.pictureInPictureEnabled && video) {
                    await video.requestPictureInPicture();
                }
            } catch (err) {}
        }

        function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    if (video.requestFullscreen) {
                        video.requestFullscreen();
                    } else if (video.webkitEnterFullscreen) {
                        video.webkitEnterFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            } catch (err) {}
        }

        function loadVideo(url, targetTime = 16, callback) {
            if (currentHls) {
                try {
                    currentHls.stopLoad();
                    currentHls.detachMedia();
                    currentHls.destroy();
                } catch (e) {}
                currentHls = null;
            }

            const videoHolder = document.getElementById('videoHolder');
            if (videoHolder) {
                videoHolder.innerHTML = '';
            }

            const newVideo = document.createElement('video');
            newVideo.id = 'videoElement';
            newVideo.className = 'video-player';
            newVideo.setAttribute('playsinline', '');
            newVideo.setAttribute('webkit-playsinline', '');
            newVideo.setAttribute('autoplay', '');
            newVideo.controls = isAdmin;
            videoHolder.appendChild(newVideo);
            
            video = newVideo;
            bindVideoEvents();

            setTimeout(() => {
                let streamUrl = url;
                if (!streamUrl.startsWith('blob:') && !streamUrl.includes('ts=')) {
                    streamUrl += (streamUrl.includes('?') ? '&' : '?') + 'ts=' + Date.now();
                }

                if (streamUrl.endsWith('.m3u8') || streamUrl.includes('.m3u8')) {
                    if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = streamUrl;
                        video.load();
                        setupStartTime(targetTime, callback);
                    } else if (Hls.isSupported()) {
                        currentHls = new Hls({
                            autoStartLoad: true,
                            startPosition: targetTime > 0 ? targetTime : 16,
                            maxBufferLength: 30,
                            maxMaxBufferLength: 60,
                            liveSyncDurationCount: 1,
                            xhrSetup: function (xhr, url) {
                                xhr.withCredentials = false;
                            }
                        });
                        
                        currentHls.attachMedia(video);
                        
                        currentHls.on(Hls.Events.MEDIA_ATTACHED, () => {
                            currentHls.loadSource(streamUrl);
                        });

                        const handleStart = () => {
                            setupStartTime(targetTime, callback);
                            if (callback) callback();
                        };

                        currentHls.on(Hls.Events.MANIFEST_PARSED, handleStart);
                        
                        setTimeout(() => {
                            if (video.paused && targetTime === 16) {
                                handleStart();
                            }
                        }, 600);

                        currentHls.on(Hls.Events.ERROR, function(event, data) {
                            if (data.fatal) {
                                switch(data.type) {
                                    case Hls.ErrorTypes.NETWORK_ERROR:
                                        currentHls.startLoad();
                                        break;
                                    case Hls.ErrorTypes.MEDIA_ERROR:
                                        currentHls.recoverMediaError();
                                        break;
                                    default:
                                        currentHls.destroy();
                                        break;
                                }
                            }
                        });
                    }
                } else {
                    video.src = streamUrl;
                    video.load();
                    setupStartTime(targetTime, callback);
                }
            }, 300);
        }

        function setupStartTime(targetTime, callback) {
            const timeToSet = targetTime > 0 ? targetTime : 16;
            video.currentTime = timeToSet;
            if (callback) callback();
        }

        function bindVideoEvents() {
            // Очередь отключена: видео теперь останавливается по окончании без автопереключения
            video.addEventListener('ended', () => {
                if (isAdmin) {
                    video.pause();
                }
            });

            video.addEventListener('seeking', () => {
                if (isAdmin && !isSyncing) broadcastCommand({ type: 'seek', index: currentPlaylistIndex, url: activeStreamUrl, time: video.currentTime, paused: video.paused });
            });
            
            video.addEventListener('play', () => {
                if (isAdmin && !isSyncing) {
                    if (pauseDebounceTimer) clearTimeout(pauseDebounceTimer);
                    broadcastCommand({ type: 'play', index: currentPlaylistIndex, url: activeStreamUrl, time: video.currentTime, paused: false });
                }
            });
            
            video.addEventListener('pause', () => {
                if (isAdmin && !isSyncing) {
                    if (document.hidden || document.visibilityState === 'hidden') return;
                    if (pauseDebounceTimer) clearTimeout(pauseDebounceTimer);
                    pauseDebounceTimer = setTimeout(() => {
                        if (video.paused) {
                            broadcastCommand({ type: 'pause', index: currentPlaylistIndex, url: activeStreamUrl, time: video.currentTime, paused: true });
                        }
                    }, 400);
                }
            });
        }

        bindVideoEvents();

        if (isAdmin) {
            hasStartedStream = true;
            document.getElementById('sync-overlay').style.display = 'none';
            loadVideo(activeStreamUrl, 16, () => {
                video.play().catch(() => {});
            });
        } else {
            showSyncPrompt("Включить стрим");
        }

        function broadcastCommand(data) {
            if (isAdmin) {
                viewers.forEach(conn => {
                    if (conn && conn.open) {
                        conn.send(data);
                    }
                });
            }
        }
    </script>
</body>
</html>
