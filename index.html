<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Room</title>
    <!-- Библиотека HLS.js для m3u8 видеопотоков -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Библиотека PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background-color: #0b0b0b; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .stream-container {
            position: relative; width: 100%; height: 100%;
            max-width: 480px; max-height: 100vh;
            background: #000; overflow: hidden;
            display: flex; flex-direction: column;
        }
        @media (min-width: 481px) {
            .stream-container {
                max-width: 900px; width: 95vw; height: 95vh; max-height: 95vh;
                border-radius: 24px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            }
        }
        .video-player {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 67%; 
            object-fit: contain; background: #000;
        }
        .chat-overlay {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 33%; 
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 75%, transparent 100%);
            display: flex; flex-direction: column; justify-content: flex-end;
            z-index: 10;
        }
        .chat-box { width: 100%; height: calc(100% - 32px); overflow: hidden; background: transparent; }
        .chat-box iframe { width: 100%; height: 100%; border: none; background: transparent; }

        /* Подняли кнопки выше, чтобы они не уходили за экран */
        .controls-group {
            position: absolute; bottom: 8px; right: 8px;
            z-index: 100; display: flex; gap: 4px; height: 24px; align-items: center;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px;
            width: 22px; height: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .ctrl-btn svg { width: 11px; height: 11px; fill: currentColor; }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }

        .ctrl-btn.admin-active {
            color: #00ffcc;
            border-color: rgba(0, 255, 204, 0.4);
            background: rgba(0, 255, 204, 0.15);
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
        }

        #sync-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 67%;
            background: #000000; z-index: 40; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #waiting-text {
            font-size: 26px; font-weight: 800; letter-spacing: 1px; color: #00ffcc;
            text-transform: uppercase; text-shadow: 0 0 20px rgba(0,255,204,0.4);
            text-align: center; padding: 0 20px;
        }
        #sync-btn {
            display: none; background: #00ffcc; color: #000; padding: 12px 24px;
            border-radius: 20px; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,255,204,0.4); text-align: center; cursor: pointer;
            margin-top: 15px; animation: pulse 1.5s infinite;
        }
        #sync-btn:hover { background: #00e6b8; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #admin-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 67%;
            background: rgba(10, 10, 10, 0.95); z-index: 50;
            display: none; flex-direction: column; padding: 20px; justify-content: center; gap: 10px;
            overflow-y: auto;
        }
        #admin-panel h3 { color: #00ffcc; font-size: 18px; text-align: center; margin-bottom: 2px; }
        .admin-label { font-size: 12px; color: #aaa; }
        .admin-select, .admin-input, .admin-btn-action {
            width: 100%; padding: 10px; background: #1a1a1a; color: #fff;
            border: 1px solid #333; border-radius: 8px; font-size: 13px; outline: none;
        }
        .admin-file-label {
            display: block; background: #1a1a1a; border: 1px dashed #00ffcc; color: #00ffcc;
            padding: 10px; text-align: center; border-radius: 8px; font-size: 13px; cursor: pointer;
        }
        .admin-file-label:hover { background: rgba(0,255,204,0.1); }
        #localVideoInput { display: none; }
        .admin-btn-action { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="stream-container">
        <div id="sync-overlay">
            <div id="waiting-text">Stream Room</div>
            <div id="sync-btn" onclick="unlockPlayback()">▶ Нажмите для старта и синхронизации</div>
        </div>

        <video id="videoElement" class="video-player" playsinline autoplay></video>

        <div class="chat-overlay">
            <div class="chat-box">
                <iframe src="https://www5.cbox.ws/box/?boxid=967024&boxtag=lVnQsO" allowtransparency="yes" allow="autoplay" frameborder="0"></iframe>
            </div>
            
            <div class="controls-group">
                <button class="ctrl-btn" onclick="toggleFullscreen()" title="На весь экран">
                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="togglePiP()" title="Картинка в картинке">
                    <svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.99h18v14.02z"/></svg>
                </button>
                <button class="ctrl-btn" id="adminBtn" onclick="toggleAdminPanel()" title="Админ">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
            </div>
        </div>

        <div id="admin-panel">
            <h3>Пульт трансляции</h3>
            <div class="admin-label">Выбрать сериал / фильм:</div>
            <select id="movieSelect" class="admin-select" onchange="changeMovieAdmin()">
                <option value="https://o8.anwap.be/serials/oshls/IUjtqdHF7qTfnQsJGYp_sA/1790282612/Lyudi_Iks_97_1_sezon_-_1_seriya_(anwap.org).m3u8">Люди Икс 97 (1 сезон 1 серия)</option>
                <option value="https://o8.anwap.be/serials/oshls/HNDDNVU5cxTE6glAC3mVmA/1790296490/Lyudi_Iks_97_1_sezon_-_2_seriya_(anwap.org).m3u8">Люди Икс 97 (1 сезон 2 серия)</option>
                <option value="https://o8.anwap.be/serials/oshls/-zWD4d_xVTn6P9WXHDW5IQ/1790300984/Lyudi_Iks_97_1_sezon_-_3_seriya_(anwap.org).m3u8">Люди Икс 97 (1 сезон 3 серия)</option>
                <option value="https://o8.anwap.be/serials/oshls/rPxMUpcEI6I7KIdwnLWbkQ/1790301060/Lyudi_Iks_97_1_sezon_-_4_seriya_(anwap.org).m3u8">Люди Икс 97 (1 сезон 4 серия)</option>
                <option value="https://o8.anwap.be/serials/oshls/WtJF55Cpr376S6NYdQ3Y7A/1790301120/Lyudi_Iks_97_1_sezon_-_5_seriya_(anwap.org).m3u8">Люди Икс 97 (1 сезон 5 серия)</option>
                <option value="https://o8.anwap.be/serials/oshls/r-wkm0TdDdy5MtdEYdYmIw/1790301196/Lyudi_Iks_97_1_sezon_-_6_seriya_(anwap.org).m3u8">Люди Икс '97 (1 сезон 6 серия)</option>
                <option value="https://o8.anwap.be/serials/oshls/OD8a3jgGnH8dX3bXg4kXpg/1790301247/Lyudi_Iks_97_1_sezon_-_7_seriya_(anwap.org).m3u8">Люди Икс 97 (1 сезон 7 серия)</option>
                <option value="https://o8.anwap.be/serials/oshls/IRj6rVZMFQlgGuOs-cGTWg/1790301283/Люди Икс 97 (1 сезон 8 серия)</option>
                <option value="https://o9.anwap.be/serials/oshls/Mk3yOj0cscTRY0uIkvId3Q/1790301313/Люди Икс 97 (1 сезон 9 серия)</option>
                <option value="https://o9.anwap.be/serials/oshls/zLgXHhmoa3mVcAFc2e2KUQ/1790301346/Люди Икс '97 (1 сезон 10 серия)</option>
            </select>

            <div class="admin-label">Или вставить ссылку вручную:</div>
            <input type="text" id="customUrlInput" class="admin-input" placeholder="https://..." value="">
            <button class="admin-btn-action" onclick="playCustomUrl()">Воспроизвести ссылку</button>

            <div class="admin-label" style="margin-top: 4px;">Или загрузить файл с устройства:</div>
            <label class="admin-file-label">
                📁 Выбрать видеофайл (.mp4)
                <input type="file" id="localVideoInput" accept="video/mp4,video/*" onchange="playLocalVideo(event)">
            </label>

            <button class="admin-btn-action" onclick="closeAdminPanel()" style="background: #333; color: #fff; margin-top: 6px;">Скрыть пульт</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const adminBtn = document.getElementById('adminBtn');
        let isAdmin = false;
        let peer;
        let viewers = [];
        let adminConnection = null;
        let isSyncing = false;
        let wakeLock = null;
        let syncInterval = null;
        let reconnectTimer = null;
        let hasStartedStream = false;
        let latestAdminData = null;

        const ROOM_ID = "strmweb_live_room_stable_2026_v10";

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
                if (video.paused && hasStartedStream) {
                    video.play().catch(() => {});
                }
                if (!isAdmin && (!adminConnection || !adminConnection.open)) {
                    connectToHost();
                }
            }
        });

        video.addEventListener('leavepictureinpicture', () => {
            if (video.paused && hasStartedStream) {
                video.play().catch(() => {});
            }
        });

        function updatePlayerControls() {
            video.controls = isAdmin;
        }

        function initP2P() {
            updatePlayerControls();
            startAsViewer();
        }

        function startAsHost() {
            if (peer) peer.destroy();
            
            peer = new Peer(ROOM_ID + "_host", { debug: 0 });

            peer.on('open', () => {
                isAdmin = true;
                updatePlayerControls();
                requestWakeLock();
                startHostHeartbeat();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    setTimeout(startAsHost, 1500);
                }
            });

            peer.on('connection', (incomingConn) => {
                viewers.push(incomingConn);

                incomingConn.on('open', () => {
                    sendCurrentState(incomingConn);
                });

                incomingConn.on('data', (data) => {
                    if (data.type === 'get_status') {
                        sendCurrentState(incomingConn);
                    }
                });

                incomingConn.on('close', () => {
                    viewers = viewers.filter(c => c !== incomingConn);
                });
            });
        }

        function startHostHeartbeat() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if (isAdmin && !video.paused) {
                    broadcastCommand({
                        type: 'sync_state',
                        url: document.getElementById('movieSelect').value,
                        time: video.currentTime,
                        paused: video.paused
                    });
                }
            }, 1000);
        }

        function sendCurrentState(targetConn) {
            targetConn.send({
                type: 'sync_state',
                url: document.getElementById('movieSelect').value,
                time: video.currentTime,
                paused: video.paused
            });
        }

        function startAsViewer() {
            if (peer) peer.destroy();
            peer = new Peer({ debug: 0 });

            peer.on('open', () => {
                connectToHost();
            });

            peer.on('error', () => {
                handleViewerDisconnect();
            });
        }

        function connectToHost() {
            if (isAdmin) return;
            if (adminConnection && adminConnection.open) return;

            const conn = peer.connect(ROOM_ID + "_host", { serialization: 'json' });

            conn.on('open', () => {
                adminConnection = conn;
                
                if (!hasStartedStream) {
                    document.getElementById('waiting-text').style.display = 'none';
                    document.getElementById('sync-btn').style.display = 'block';
                }

                conn.send({ type: 'get_status' });
                
                if (reconnectTimer) {
                    clearInterval(reconnectTimer);
                    reconnectTimer = null;
                }
            });

            conn.on('data', (data) => {
                latestAdminData = data;
                handleRemoteCommand(data);
            });

            conn.on('error', () => {
                handleViewerDisconnect();
            });

            conn.on('close', () => {
                handleViewerDisconnect();
            });
        }

        function handleViewerDisconnect() {
            adminConnection = null;
            
            if (!isAdmin && hasStartedStream) {
                const syncBtn = document.getElementById('sync-btn');
                syncBtn.style.display = 'block';
                syncBtn.innerText = "🔄 Синхронизировать с админом";
            }

            if (!isAdmin && !reconnectTimer) {
                reconnectTimer = setInterval(() => {
                    connectToHost();
                }, 3000);
            }
        }

        initP2P();

        function unlockPlayback() {
            hasStartedStream = true;
            document.getElementById('sync-overlay').style.display = 'none';
            video.muted = false;
            requestWakeLock();

            if (latestAdminData) {
                applyAdminData(latestAdminData);
            } else if (adminConnection && adminConnection.open) {
                adminConnection.send({ type: 'get_status' });
            } else {
                loadVideo(document.getElementById('movieSelect').value, 16, () => {
                    video.play().catch(() => {});
                });
            }
        }

        function handleRemoteCommand(data) {
            if (!isAdmin) {
                if (!hasStartedStream) {
                    document.getElementById('waiting-text').style.display = 'none';
                    document.getElementById('sync-btn').style.display = 'block';
                    return;
                }

                isSyncing = true;
                applyAdminData(data);
                setTimeout(() => { isSyncing = false; }, 300);
            }
        }

        function applyAdminData(data) {
            if (data.type === 'sync_state' || data.type === 'change_movie') {
                const currentUrl = document.getElementById('movieSelect').value;
                if (currentUrl !== data.url) {
                    document.getElementById('movieSelect').value = data.url;
                    loadVideo(data.url, data.time, () => {
                        if (!data.paused) video.play().catch(() => {});
                    });
                } else {
                    if (Math.abs(video.currentTime - data.time) > 1.5) {
                        video.currentTime = data.time;
                    }
                    if (data.paused) {
                        video.pause();
                    } else {
                        video.play().catch(() => {});
                    }
                }
            } else if (data.type === 'seek') {
                video.currentTime = data.time;
            } else if (data.type === 'play') {
                video.play().catch(() => {});
            } else if (data.type === 'pause') {
                video.pause();
            }
        }

        function toggleAdminPanel() {
            if (isAdmin) {
                document.getElementById('admin-panel').style.display = 'flex';
                return;
            }

            let pass = prompt("Введите код администратора:");
            if (pass === "777") {
                isAdmin = true;
                hasStartedStream = true;
                updatePlayerControls();
                
                adminBtn.classList.add('admin-active');

                loadVideo(document.getElementById('movieSelect').value, 16, () => {
                    video.play().catch(() => {});
                });
                document.getElementById('sync-overlay').style.display = 'none';

                startAsHost();
                document.getElementById('admin-panel').style.display = 'flex';
            } else if (pass !== null) {
                alert("Неверный пароль!");
            }
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function playCustomUrl() {
            const urlInput = document.getElementById('customUrlInput');
            const url = urlInput.value.trim();
            if (!url) {
                alert("Введите ссылку на видео!");
                return;
            }

            const select = document.getElementById('movieSelect');
            let opt = document.createElement('option');
            opt.value = url;
            opt.textContent = "🔗 Ручная ссылка: " + url.split('/').pop().substring(0, 25);
            select.insertBefore(opt, select.firstChild);
            select.selectedIndex = 0;

            // Теперь ручные ссылки запускаются с 16 секунды точно так же, как и остальные потоки
            loadVideo(url, 16, () => {
                video.play().catch(() => {});
                broadcastCommand({ type: 'change_movie', url: url, time: 16, paused: false });
            });
            alert("Ссылка запущена!");
        }

        function playLocalVideo(event) {
            const file = event.target.files[0];
            if (!file) return;
            const fileURL = URL.createObjectURL(file);

            const select = document.getElementById('movieSelect');
            let opt = document.createElement('option');
            opt.value = fileURL;
            opt.textContent = `📁 ${file.name}`;
            select.insertBefore(opt, select.firstChild);
            select.selectedIndex = 0;

            loadVideo(fileURL, 16, () => {
                video.play().catch(() => {});
                broadcastCommand({ type: 'change_movie', url: fileURL, time: 16, paused: false });
            });
        }

        async function togglePiP() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (document.pictureInPictureEnabled && video) {
                    await video.requestPictureInPicture();
                }
            } catch (err) {
                console.log("PiP error:", err);
            }
        }

        function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    if (video.requestFullscreen) {
                        video.requestFullscreen();
                    } else if (video.webkitEnterFullscreen) {
                        video.webkitEnterFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            } catch (err) {
                console.log("Fullscreen error:", err);
            }
        }

        function loadVideo(url, targetTime = 16, callback) {
            // Поддержка различных форматов и потоков (mp4, m3u8, веб-потоки)
            if (url.includes('.m3u8')) {
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    setupStartTime(targetTime, callback);
                } else if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        setupStartTime(targetTime, callback);
                    });
                } else {
                    video.src = url;
                    setupStartTime(targetTime, callback);
                }
            } else {
                video.src = url;
                setupStartTime(targetTime, callback);
            }
        }

        function setupStartTime(targetTime, callback) {
            const setTimeOnce = () => {
                if (video.currentTime < 1) {
                    video.currentTime = targetTime;
                }
                video.removeEventListener('loadedmetadata', setTimeOnce);
                if (callback) callback();
            };
            if (video.readyState >= 1) {
                if (video.currentTime < 1) video.currentTime = targetTime;
                if (callback) callback();
            } else {
                video.addEventListener('loadedmetadata', setTimeOnce);
            }
        }

        function changeMovieAdmin() {
            const url = document.getElementById('movieSelect').value;
            loadVideo(url, 16, () => {
                video.play().catch(() => {});
                broadcastCommand({ type: 'change_movie', url: url, time: 16, paused: false });
            });
        }

        video.addEventListener('ended', () => {
            if (isAdmin) {
                const select = document.getElementById('movieSelect');
                if (select.selectedIndex < select.options.length - 1) {
                    select.selectedIndex++;
                } else {
                    select.selectedIndex = 0;
                }
                changeMovieAdmin();
            }
        });

        function broadcastCommand(data) {
            if (isAdmin) {
                viewers.forEach(conn => {
                    if (conn && conn.open) {
                        conn.send(data);
                    }
                });
            }
        }

        video.addEventListener('seeking', () => {
            if (isAdmin && !isSyncing) broadcastCommand({ type: 'seek', time: video.currentTime });
        });
        video.addEventListener('play', () => {
            if (isAdmin && !isSyncing) broadcastCommand({ type: 'play', time: video.currentTime, paused: false });
        });
        video.addEventListener('pause', () => {
            if (isAdmin && !isSyncing) broadcastCommand({ type: 'pause', time: video.currentTime, paused: true });
        });
    </script>
</body>
</html>
